# Builds and tests Tsumi on every push and pull request.  On a tag v<version>, such as v1.0, it also packages the
# Windows and Linux executables with the network and drafts the release "Tsumi <version>", for its notes to be
# written and published.  To release: publish the network if it is new (tools/release_net.py), set VERSION in
# src/uci.cpp, commit, and push the tag.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the scripts are executable
        run: |
          while read -r f; do
              test -x "$f" || { echo "$f has a shebang but is not executable in git: git update-index --chmod=+x $f"; exit 1; }
          done < <(grep -ls '^#!' tools/* tests/* train/*)
      - name: Install the Windows cross-compiler, qemu and python-chess
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64-posix qemu-user
          python3 -m pip install --upgrade chess ruff
      - name: Build
        run: |
          make -j universal LDFLAGS="-static -pthread -flto=auto"
          make -j windows
          cp tsumi-universal tsumi
      - name: Get the network
        env:
          GH_TOKEN: ${{ github.token }}
        run: make net NET_FETCH='gh release download networks --pattern "$@" --output "$@.tmp" --clobber'
      - name: Test
        run: |
          tests/run_all.sh
          tests/universal.sh
          ruff check .
      - name: Package
        if: github.ref_type == 'tag'
        run: |
          version=${GITHUB_REF_NAME#v}
          ./tsumi-universal uci quit | grep -qx "id name Tsumi $version" ||
              { echo "the tag $GITHUB_REF_NAME does not match VERSION in src/uci.cpp"; exit 1; }
          net=$(ls tsumi-*.nnue)
          win=tsumi-$version-windows-x86-64
          linux=tsumi-$version-linux-x86-64
          mkdir -p dist "$win" "$linux"
          cp tsumi.exe "$win/" && cp "$net" "$win/"
          cp tsumi-universal "$linux/tsumi" && cp "$net" "$linux/"
          zip -qr "dist/$win.zip" "$win"
          tar czf "dist/$linux.tar.gz" "$linux"
          (cd dist && sha256sum -- * > SHA256SUMS)
          bench=$(./tsumi-universal "setoption name EvalFile value $net" "bench 13" | awk '/Nodes searched/ {print $NF}')
          {
            echo "Tsumi $version, a selfmate chess engine (UCI)."
            echo
            echo "- Network: \`$net\`, in both archives; its training checkpoint is in the [networks release](https://github.com/$GITHUB_REPOSITORY/releases/tag/networks)."
            echo "- Bench signature with it: \`bench 13\` = $bench nodes."
            echo "- Runs on any x86-64 CPU with SSE4.2 and POPCNT (Intel since 2008, AMD since 2011) and uses AVX2 or AVX-512 when the CPU has them."
          } > notes.md
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload --clobber "$GITHUB_REF_NAME" dist/*
          else
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Tsumi ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
          fi
