# Builds and tests Tsumi on every push and pull request.  On a tag v<version> it also packages the Windows and
# Linux executables with the network and drafts the release for the notes to be written (README: Releasing).
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # the draft release
    steps:
      - uses: actions/checkout@v4
      - name: Install the Windows cross-compiler, qemu and python-chess
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 qemu-user
          python3 -m pip install --upgrade chess ruff
      - name: Build
        run: |
          make -j universal LDFLAGS="-static -pthread -flto=auto"   # static: runs on any Linux
          make -j windows
          cp tsumi-universal tsumi   # the tests run ./tsumi
      - name: Get the network
        env:
          GH_TOKEN: ${{ github.token }}
        run: make net NET_FETCH='gh release download networks --pattern "$@" --output "$@.tmp" --clobber'
      - name: Test
        run: |
          tests/run_all.sh
          tests/universal.sh
          ruff check .
      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=${GITHUB_REF_NAME#v}
          ./tsumi-universal uci quit | grep -qx "id name Tsumi $version" ||
              { echo "the tag $GITHUB_REF_NAME does not match VERSION in src/uci.cpp"; exit 1; }
          net=$(ls tsumi-*.nnue)
          win=tsumi-$version-windows-x86-64
          linux=tsumi-$version-linux-x86-64
          mkdir -p dist "$win" "$linux"
          cp tsumi.exe "$win/$win.exe" && cp "$net" "$win/"
          cp tsumi-universal "$linux/$linux" && cp "$net" "$linux/"
          zip -qr "dist/$win.zip" "$win"
          tar czf "dist/$linux.tar.gz" "$linux"
          (cd dist && sha256sum -- * > SHA256SUMS)
          bench=$(./tsumi-universal "setoption name EvalFile value $net" "bench 13" | awk '/Nodes searched/ {print $NF}')
          {
            echo "Tsumi $version, a selfmate chess engine (UCI)."
            echo
            echo "- Network: \`$net\`, in both archives; its training checkpoint is in the [networks release](https://github.com/$GITHUB_REPOSITORY/releases/tag/networks)."
            echo "- Bench signature with it: \`bench 13\` = $bench nodes."
            echo "- Runs on any x86-64 CPU with SSE4.2 and POPCNT (Intel since 2008, AMD since 2011) and uses AVX2 or AVX-512 when the CPU has them."
          } > notes.md
      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then   # a re-run: replace the assets
              gh release upload --clobber "$GITHUB_REF_NAME" dist/*
          else
              gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Tsumi ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
          fi
